# Desktop release — tag push v* publishes; workflow_dispatch for manual packs.
#
# Prerequisites:
#   - Bump apps/desktop/package.json version before tagging
#   - Optional: code-signing certs (Windows Authenticode, macOS Developer ID)
#
# Unsigned builds are fine for beta — SmartScreen/Gatekeeper may warn on first open.

name: Desktop release

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Upload to GitHub Releases (uses GITHUB_TOKEN)'
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

jobs:
  build-win:
    name: Windows pack
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Node 20 avoids @vercel/og Invalid URL on Windows when prerendering icon/OG routes.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install desktop dependencies
        run: npm --prefix apps/desktop ci

      - name: Build Next standalone
        run: npm run build
        env:
          FLATSIX_DESKTOP_BUILD: 'true'
          # Real garage auth — set these as repo Actions secrets (same values as Vercel).
          NEXT_PUBLIC_DEMO_MODE: 'false'
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Prepare Electron standalone
        run: npm --prefix apps/desktop run prepare:standalone

      - name: Pack Windows installers
        working-directory: apps/desktop
        run: npx electron-builder --win nsis portable --x64 --publish never

      - name: Publish Windows release assets
        if: github.event_name == 'push' || inputs.publish
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "v$version"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title $version --prerelease --notes "FLAT·SIX Desktop $version"
          }
          $assets = Get-ChildItem release -File | Where-Object {
            $_.Extension -in '.exe', '.blockmap', '.yml'
          }
          foreach ($asset in $assets) {
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              gh release upload $tag $asset.FullName --clobber
              if ($LASTEXITCODE -eq 0) { break }
              Write-Host "Upload failed for $($asset.Name) (attempt $attempt/3); retrying in 30s..."
              Start-Sleep -Seconds 30
            }
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }

      - name: Upload artifacts
        if: github.event_name == 'workflow_dispatch' && !inputs.publish
        uses: actions/upload-artifact@v4
        with:
          name: desktop-win
          path: apps/desktop/release/*

  build-mac:
    name: macOS pack
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install desktop dependencies
        run: npm --prefix apps/desktop ci

      - name: Build Next standalone
        run: npm run build
        env:
          FLATSIX_DESKTOP_BUILD: 'true'
          # Real garage auth — set these as repo Actions secrets (same values as Vercel).
          NEXT_PUBLIC_DEMO_MODE: 'false'
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Prepare Electron standalone
        run: npm --prefix apps/desktop run prepare:standalone

      - name: Pack macOS DMG + zip
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.publish }}" = "true" ]; then
            npx electron-builder --mac dmg zip --x64 --arm64 --publish always
          else
            npm run pack:mac
          fi

      - name: Upload artifacts
        if: github.event_name == 'workflow_dispatch' && !inputs.publish
        uses: actions/upload-artifact@v4
        with:
          name: desktop-mac
          path: apps/desktop/release/*
