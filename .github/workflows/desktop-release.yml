# Desktop release — tag push v* publishes; workflow_dispatch for manual packs.
#
# Prerequisites:
#   - Bump apps/desktop/package.json version before tagging
#   - Optional: code-signing certs (Windows Authenticode, macOS Developer ID)
#
# Unsigned builds are fine for beta — SmartScreen/Gatekeeper may warn on first open.

name: Desktop release

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Upload to GitHub Releases (uses GITHUB_TOKEN)'
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

jobs:
  build-win:
    name: Windows pack
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Node 20 avoids @vercel/og Invalid URL on Windows when prerendering icon/OG routes.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install desktop dependencies
        run: npm --prefix apps/desktop ci

      - name: Build Next standalone
        run: npm run build
        env:
          FLATSIX_DESKTOP_BUILD: 'true'
          # Real garage auth — set these as repo Actions secrets (same values as Vercel).
          NEXT_PUBLIC_DEMO_MODE: 'false'
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Prepare Electron standalone
        run: npm --prefix apps/desktop run prepare:standalone

      - name: Bundle OBD host + icons
        run: |
          npm --prefix apps/desktop run bundle:host
          npm --prefix apps/desktop run icons
          test -f apps/desktop/obd-host-runner.mjs

      - name: Pack Windows installers
        working-directory: apps/desktop
        run: npx electron-builder --win nsis portable --x64 --publish never

      - name: Publish Windows release assets
        if: github.event_name == 'push' || inputs.publish
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "v$version"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title $version --prerelease --notes "FLAT·SIX Desktop $version"
          }
          $assets = Get-ChildItem release -File | Where-Object {
            $_.Extension -in '.exe', '.blockmap', '.yml'
          }
          foreach ($asset in $assets) {
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              gh release upload $tag $asset.FullName --clobber
              if ($LASTEXITCODE -eq 0) { break }
              Write-Host "Upload failed for $($asset.Name) (attempt $attempt/3); retrying in 30s..."
              Start-Sleep -Seconds 30
            }
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }

      - name: Upload artifacts
        if: github.event_name == 'workflow_dispatch' && !inputs.publish
        uses: actions/upload-artifact@v4
        with:
          name: desktop-win
          path: apps/desktop/release/*

  build-mac:
    name: macOS pack
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install desktop dependencies
        run: npm --prefix apps/desktop ci

      - name: Build Next standalone
        run: npm run build
        env:
          FLATSIX_DESKTOP_BUILD: 'true'
          # Real garage auth — set these as repo Actions secrets (same values as Vercel).
          NEXT_PUBLIC_DEMO_MODE: 'false'
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Prepare Electron standalone
        run: npm --prefix apps/desktop run prepare:standalone

      - name: Bundle OBD host + icons
        run: |
          npm --prefix apps/desktop run bundle:host
          npm --prefix apps/desktop run icons
          test -f apps/desktop/obd-host-runner.mjs

      - name: Pack macOS DMG + zip
        working-directory: apps/desktop
        run: |
          # `hdiutil detach … Resource busy (exit 16)` while building the DMG is a
          # known CI flake: Spotlight (mds/mdworker) grabs the freshly-mounted DMG
          # volume before electron-builder can detach it, so the (second) arm64 DMG
          # build fails. Disable Spotlight indexing to fix the root cause, then retry
          # the BUILD to ride out any residual flakiness.
          #
          # IMPORTANT: build only (`--publish never`). Do NOT use electron-builder's
          # `--publish always` here — it is NOT retry-safe: a retry (or partial
          # publish) re-POSTs an already-uploaded asset and GitHub returns
          # `422 already_exists` for the .dmg, failing the job AFTER it has published
          # some assets but before the arm64 DMG / latest-mac.yml. Assets are uploaded
          # idempotently in the next step with `gh release upload --clobber` (same
          # pattern as the Windows job), so retries and re-runs never collide.
          sudo mdutil -a -i off || true
          for attempt in 1 2 3; do
            if npx electron-builder --mac dmg zip --x64 --arm64 --publish never; then
              exit 0
            fi
            echo "macOS pack attempt ${attempt}/3 failed; retrying in 20s…"
            sleep 20
          done
          echo "macOS pack failed after 3 attempts" >&2
          exit 1

      - name: Publish macOS release assets
        if: github.event_name == 'push' || inputs.publish
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          # Create the release if the Windows job hasn't yet (either job may win the
          # race); tolerate a concurrent create from the other job.
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "$version" --prerelease --notes "FLAT·SIX Desktop $version" \
              || gh release view "$tag" >/dev/null 2>&1
          fi
          # Upload each mac artifact idempotently — --clobber overwrites any existing
          # asset of the same name, so retries and re-runs never hit 422 already_exists.
          shopt -s nullglob
          for asset in release/*.dmg release/*.dmg.blockmap release/*-mac.zip release/latest-mac.yml; do
            ok=
            for attempt in 1 2 3; do
              if gh release upload "$tag" "$asset" --clobber; then ok=1; break; fi
              echo "Upload failed for $(basename "$asset") (attempt ${attempt}/3); retrying in 30s…"
              sleep 30
            done
            if [ -z "$ok" ]; then
              echo "Failed to upload $(basename "$asset") after 3 attempts" >&2
              exit 1
            fi
          done

      - name: Upload artifacts
        if: github.event_name == 'workflow_dispatch' && !inputs.publish
        uses: actions/upload-artifact@v4
        with:
          name: desktop-mac
          path: apps/desktop/release/*
