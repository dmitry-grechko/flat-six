# Desktop release — tag push v* publishes; workflow_dispatch for manual packs.
#
# Prerequisites:
#   - Bump apps/desktop/package.json version before tagging
#   - Optional: code-signing certs (Windows Authenticode, macOS Developer ID)
#
# Unsigned builds are fine for beta — SmartScreen/Gatekeeper may warn on first open.

name: Desktop release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Upload to GitHub Releases (uses GITHUB_TOKEN)'
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

jobs:
  build-win:
    name: Windows pack
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install desktop dependencies
        run: npm --prefix apps/desktop ci

      - name: Build Next standalone
        run: npm run build
        env:
          NEXT_PUBLIC_DEMO_MODE: 'true'
          NEXT_PUBLIC_SUPABASE_URL: https://demo.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: demo-anon-key

      - name: Prepare Electron standalone
        run: npm --prefix apps/desktop run prepare:standalone

      - name: Pack Windows installers
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ("${{ github.event_name }}" -eq "push" -or "${{ inputs.publish }}" -eq "true") {
            npx electron-builder --win nsis portable --x64 --publish always
          } else {
            npm run pack
          }

      - name: Upload artifacts
        if: github.event_name == 'workflow_dispatch' && !inputs.publish
        uses: actions/upload-artifact@v4
        with:
          name: desktop-win
          path: apps/desktop/release/*

  build-mac:
    name: macOS pack
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install desktop dependencies
        run: npm --prefix apps/desktop ci

      - name: Build Next standalone
        run: npm run build
        env:
          NEXT_PUBLIC_DEMO_MODE: 'true'
          NEXT_PUBLIC_SUPABASE_URL: https://demo.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: demo-anon-key

      - name: Prepare Electron standalone
        run: npm --prefix apps/desktop run prepare:standalone

      - name: Pack macOS DMG + zip
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.publish }}" = "true" ]; then
            npx electron-builder --mac dmg zip --x64 --arm64 --publish always
          else
            npm run pack:mac
          fi

      - name: Upload artifacts
        if: github.event_name == 'workflow_dispatch' && !inputs.publish
        uses: actions/upload-artifact@v4
        with:
          name: desktop-mac
          path: apps/desktop/release/*
