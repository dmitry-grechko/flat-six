# Desktop release — tag push v* publishes; workflow_dispatch for manual packs.
#
# Prerequisites:
#   - Bump apps/desktop/package.json version before tagging
#   - Optional: code-signing certs (Windows Authenticode, macOS Developer ID)
#
# Unsigned builds are fine for beta — SmartScreen/Gatekeeper may warn on first open.

name: Desktop release

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Upload to GitHub Releases (uses GITHUB_TOKEN)'
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

jobs:
  build-win:
    name: Windows pack
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Node 20 avoids @vercel/og Invalid URL on Windows when prerendering icon/OG routes.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install desktop dependencies
        run: npm --prefix apps/desktop ci

      - name: Build Next standalone
        run: npm run build
        env:
          FLATSIX_DESKTOP_BUILD: 'true'
          # Real garage auth — set these as repo Actions secrets (same values as Vercel).
          NEXT_PUBLIC_DEMO_MODE: 'false'
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Prepare Electron standalone
        run: npm --prefix apps/desktop run prepare:standalone

      - name: Bundle OBD host + icons
        run: |
          npm --prefix apps/desktop run bundle:host
          npm --prefix apps/desktop run icons
          test -f apps/desktop/obd-host-runner.mjs

      - name: Pack Windows installers
        working-directory: apps/desktop
        run: npx electron-builder --win nsis portable --x64 --publish never

      - name: Publish Windows release assets
        if: github.event_name == 'push' || inputs.publish
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "v$version"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title $version --prerelease --notes "FLAT·SIX Desktop $version"
          }
          $assets = Get-ChildItem release -File | Where-Object {
            $_.Extension -in '.exe', '.blockmap', '.yml'
          }
          foreach ($asset in $assets) {
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              gh release upload $tag $asset.FullName --clobber
              if ($LASTEXITCODE -eq 0) { break }
              Write-Host "Upload failed for $($asset.Name) (attempt $attempt/3); retrying in 30s..."
              Start-Sleep -Seconds 30
            }
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }

      - name: Upload artifacts
        if: github.event_name == 'workflow_dispatch' && !inputs.publish
        uses: actions/upload-artifact@v4
        with:
          name: desktop-win
          path: apps/desktop/release/*

  build-mac:
    name: macOS pack
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install desktop dependencies
        run: npm --prefix apps/desktop ci

      - name: Build Next standalone
        run: npm run build
        env:
          FLATSIX_DESKTOP_BUILD: 'true'
          # Real garage auth — set these as repo Actions secrets (same values as Vercel).
          NEXT_PUBLIC_DEMO_MODE: 'false'
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Prepare Electron standalone
        run: npm --prefix apps/desktop run prepare:standalone

      - name: Bundle OBD host + icons
        run: |
          npm --prefix apps/desktop run bundle:host
          npm --prefix apps/desktop run icons
          test -f apps/desktop/obd-host-runner.mjs

      - name: Pack + publish macOS DMG + zip
        working-directory: apps/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # `hdiutil detach … Resource busy (exit 16)` while building the DMG is a
          # known CI flake: Spotlight (mds/mdworker) grabs the freshly-mounted DMG
          # volume before electron-builder can detach it, so the (second) arm64 DMG
          # build fails. Disable Spotlight indexing to fix the root cause, then retry.
          sudo mdutil -a -i off || true

          if [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.publish }}" = "true" ]; then
            version=$(node -p "require('./package.json').version")
            tag="v$version"
            # Publish with electron-builder's own uploader (`--publish always`), NOT a
            # plain `gh release upload` of the on-disk files. The mac target has no
            # explicit `artifactName` (the win targets do), so on macOS electron-builder
            # names assets from the scoped package name (`@flatsix/desktop-*`) and writes
            # those SAME names into latest-mac.yml. A plain gh upload would push the
            # on-disk names (`FLAT.SIX-*`) instead, leaving latest-mac.yml pointing at
            # names/checksums that don't match the uploaded files → broken auto-update.
            #
            # electron-builder's uploader keeps assets and latest-mac.yml in sync, but is
            # NOT retry-safe: a retry (or partial upload) re-POSTs an existing asset and
            # GitHub returns `422 already_exists`, killing the job mid-publish. So before
            # EACH attempt we delete any mac assets left by a prior attempt / re-run,
            # letting it publish a clean, self-consistent set. (Windows assets — .exe /
            # latest.yml — never match these patterns, so the concurrent win job is safe.)
            publish() {
              if gh release view "$tag" >/dev/null 2>&1; then
                gh release view "$tag" --json assets -q '.assets[].name' \
                  | grep -Ei '(-mac\.zip|\.dmg|\.dmg\.blockmap|latest-mac\.yml)$' \
                  | while read -r a; do
                      echo "clearing stale mac asset: $a"
                      gh release delete-asset "$tag" "$a" --yes || true
                    done
              fi
              npx electron-builder --mac dmg zip --x64 --arm64 --publish always
            }
          else
            publish() { npm run pack:mac; }
          fi

          for attempt in 1 2 3; do
            if publish; then exit 0; fi
            echo "macOS pack attempt ${attempt}/3 failed; retrying in 20s…"
            sleep 20
          done
          echo "macOS pack failed after 3 attempts" >&2
          exit 1

      - name: Upload artifacts
        if: github.event_name == 'workflow_dispatch' && !inputs.publish
        uses: actions/upload-artifact@v4
        with:
          name: desktop-mac
          path: apps/desktop/release/*
